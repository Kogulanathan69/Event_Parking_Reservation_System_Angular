<section class="private-page">

  <div class="private-header">

    <span>PRIVATE EVENT PLANNER</span>

    <h1>
      Plan Your
      <strong>Special Event</strong>
    </h1>

    <p>
      Wedding, birthday and private function booking.
    </p>

  </div>


  <div class="private-card">

    <div class="form-group">

      <label>Event Type</label>

      <select [(ngModel)]="eventType">

        <option value="Wedding">
          Wedding
        </option>

        <option value="Birthday">
          Birthday Party
        </option>

        <option value="PrivateFunction">
          Private Function
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>Event Name</label>

      <input
        type="text"
        [(ngModel)]="eventName"
        placeholder="Example: Nirupan Wedding">

    </div>


    <div class="form-group">

      <label>Venue</label>

      <input
        type="text"
        [(ngModel)]="venue"
        placeholder="Enter venue">

    </div>


    <div class="form-row">

      <div class="form-group">

        <label>Event Date</label>

        <input
          type="date"
          [(ngModel)]="eventDate">

      </div>


      <div class="form-group">

        <label>Guest Count</label>

        <input
          type="number"
          [(ngModel)]="guestCount"
          min="1">

      </div>

    </div>


    <div class="parking-option">

      <div>
        <h3>Need Parking?</h3>

        <p>
          Reserve parking for your guests.
        </p>
      </div>

      <div class="parking-buttons">

        <button
          type="button"
          [class.active]="needParking === true"
          (click)="needParking = true">

          Yes

        </button>

        <button
          type="button"
          [class.active]="needParking === false"
          (click)="needParking = false">

          No

        </button>

      </div>

    </div>


    <button
      class="continue-btn"
      (click)="submitPrivateEvent()">

      Continue Private Event Booking →

    </button>

  </div>

</section>
